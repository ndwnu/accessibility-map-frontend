<ndw-card>
  <ndw-card-header>
    <ber-feedback-header title="Gemeente of adres kiezen" />
  </ndw-card-header>

  <ndw-card-content>
    <div class="content">
      <ndw-form-field label="Selecteer de gemeente of het adres van uw bestemming">
        <input
          ndwInput
          type="search"
          placeholder="Voer gemeente of adres in"
          [ndwAutosuggest]="autoSuggestPanel"
          (input)="addressSearchChanged($event)"
          [value]="pdokLookupService.pdokLookup()?.weergavenaam"
        />
        <ndw-autosuggest
          #autoSuggestPanel
          [options]="autosuggestOptions()"
          [noResultText]="noResultText()"
          (optionSelected)="onOptionSelected($event)"
        />
      </ndw-form-field>
      <small>
        {{ lookupIsLoading() ? 'Laden...' : '' }}
      </small>
    </div>
    @if (lookupError()) {
      <ndw-alert type="critical">
        Er is een fout opgetreden bij het ophalen van de gegevens. Probeer het later opnieuw.
      </ndw-alert>
    }
  </ndw-card-content>

  <ndw-card-footer>
    <ber-actions
      [currentStep]="2"
      [disableNext]="!pdokLookupService.pdokLookup()"
      [isLoading]="lookupIsLoading()"
      [steps]="3"
      (next)="onNext()"
      (previous)="onPrevious()"
    />
  </ndw-card-footer>
</ndw-card>
